function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const b=document.createElement('div');b.className='burst';b.innerHTML=Array.from({length:20},(_,i)=>`<i style="--x:${Math.cos(i/20*Math.PI*2)*170}px;--y:${Math.sin(i/20*Math.PI*2)*130}px;--delay:${i%4*.025}s;background:${balloonColours[i%6]}"></i>`).join('');document.querySelector('.stage').append(b);setTimeout(()=>b.remove(),1200)}
function blow(i){if(!lit[i])return;lit[i]=0;render();if(lit.every(v=>!v))burst()}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.mode===mode);$(b.dataset.mode).hidden=b.dataset.mode!==mode});$('flavours').hidden=mode!=='cake';$('cakeArt').innerHTML=`<svg viewBox="0 0 360 220" role="img" aria-label="Cake with ${lit.reduce((a,b)=>a+b,0)} candles lit"><ellipse cx="180" cy="192" rx="146" ry="13" fill="#e5ded2"/><path d="M55 109Q180 84 305 109V180Q180 206 55 180Z" fill="${colour}"/><ellipse cx="180" cy="109" rx="125" ry="22" fill="#f3e6d2"/><path d="M55 110Q80 147 102 120Q121 151 141 122Q165 151 185 122Q209 150 231 121Q261 148 305 110" fill="#f3e6d2"/>${lit.map((v,i)=>`<rect x="${105+i*45}" y="65" width="9" height="44" rx="3" fill="#73a89a"/>${v?`<path class="pop" d="M${109+i*45} 35Q${94+i*45} 57 ${109+i*45} 63Q${124+i*45} 57 ${109+i*45} 35" fill="#e7bd6c"/>`:''}`).join('')}<path d="M144 151L157 163L187 132" fill="none" stroke="#251f21" stroke-width="4" ${lit.some(Boolean)?'opacity="0"':''}/>${lit.map((v,i)=>v?`<rect data-hit="${i}" x="${85+i*45}" y="22" width="44" height="75" fill="transparent" style="cursor:pointer"/>`:'').join('')}</svg>`;$('cakeArt').querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>blow(+b.dataset.hit));$('candles').innerHTML=lit.map((v,i)=>`<button data-candle="${i}" ${v?'':'disabled'} aria-label="${v?'Blow candle':'Candle out'} ${i+1}">${v?'Blow':'✓'} ${i+1}</button>`).join('');$('candles').querySelectorAll('button').forEach(b=>b.onclick=()=>blow(+b.dataset.candle));$('pops').innerHTML=popped.map((v,i)=>`<button data-pop="${i}" aria-label="${v?'Popped':'Pop balloon'} ${i+1}" ${v?'disabled':''}>${v?icon('star'):`<svg viewBox="0 0 70 100" aria-hidden="true"><ellipse cx="35" cy="32" rx="23" ry="29" fill="${balloonColours[i]}"/><path d="M35 61Q20 77 35 94" fill="none" stroke="#746d64" stroke-width="2"/><ellipse cx="26" cy="23" rx="4" ry="9" fill="white" opacity=".5"/></svg>`}<small>${v?'✓':i+1}</small></button>`).join('');$('pops').querySelectorAll('button').forEach(b=>b.onclick=()=>{popped[+b.dataset.pop]=true;render();if(popped.every(Boolean))burst()});feedback()}
function feedback(){$('feedback').textContent=mode==='cake'?(lit.some(Boolean)?`${lit.reduce((a,b)=>a+b,0)} candles · tap a flame or a button`:'Make a wish.'):mode==='balloons'?(popped.every(Boolean)?'Every little pop counts.':`${popped.filter(Boolean).length} / 6 popped`):scratchPct>=45?'A little joy, uncovered.':`${scratchPct}% uncovered · swipe or tap Uncover`}
const c=$('scratchCanvas');let down=false,last=null,covered=new Set(),resizeTimer,scratchReady=false;function scratchReset(){scratchReady=true;const r=c.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const x=c.getContext('2d');x.globalCompositeOperation='source-over';const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,'#73a89a');g.addColorStop(1,'#adc6b3');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='#251f21';x.font=`${20*d}px Georgia`;x.textAlign='center';x.fillText('Swipe here',c.width/2,c.height/2);covered.clear();scratchPct=0;last=null;down=false;c.hidden=false;$('scratchProgress').value=0;feedback()}
function erase(e){const r=c.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};const x=c.getContext('2d'),radius=24/c.parentElement.clientWidth;x.globalCompositeOperation='destination-out';x.lineWidth=48*c.width/r.width;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo((last||p).x*c.width,(last||p).y*c.height);x.lineTo(p.x*c.width,p.y*c.height);x.stroke();x.beginPath();x.arc(p.x*c.width,p.y*c.height,24*c.width/r.width,0,Math.PI*2);x.fill();const a=last||p,steps=Math.max(1,Math.ceil(Math.hypot(p.x-a.x,p.y-a.y)*32));for(let k=0;k<=steps;k++){const q={x:a.x+(p.x-a.x)*k/steps,y:a.y+(p.y-a.y)*k/steps};for(let j=0;j<20;j++)for(let i=0;i<20;i++)if(Math.hypot((i+.5)/20-q.x,((j+.5)/20-q.y)*r.height/r.width)<=radius)covered.add(j*20+i)}last=p;scratchPct=Math.round(covered.size/400*100);$('scratchProgress').value=scratchPct;feedback();if(scratchPct>=45){c.hidden=true;down=false;$('scratchProgress').value=100;burst()}}
c.onpointerdown=e=>{if(c.hidden)return;down=true;c.setPointerCapture(e.pointerId);last=null;erase(e)};c.onpointermove=e=>{if(down)erase(e)};c.onpointerup=()=>{down=false;last=null};c.onpointercancel=()=>{down=false;last=null};$('revealAll').onclick=()=>{scratchPct=100;c.hidden=true;$('scratchProgress').value=100;feedback();burst()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();if(mode==='scratch'&&!scratchReady)scratchReset()});document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{colour=b.dataset.colour;document.querySelectorAll('[data-colour]').forEach(v=>v.setAttribute('aria-pressed',v===b));render()});$('reset').onclick=()=>{if(mode==='cake')lit=[1,1,1,1];if(mode==='balloons')popped=Array(6).fill(false);if(mode==='scratch')scratchReset();render()};addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(mode==='scratch'&&!c.hidden)scratchReset()},180)});render();

/* Original local interactions. No third-party code or media. */
const nativeDone=new Set([1,2,3,6]);
let nativeTimers=[];function stopNative(){nativeTimers.forEach(t=>clearTimeout(t));nativeTimers=[];}
const nativeNotes=['A little joy.','A little magic.','Take a tiny happy pause.','Keep your spark.','One more smile.','A wish, all yours.'];
function later(fn,ms){nativeTimers.push(setTimeout(fn,ms))}
function nativeUI(body){$('nativeStage').innerHTML=body;}
function nbutton(id,text,extra=''){return `<button id="${id}" ${extra}>${text}</button>`}
function nativeArt(kind,step=0){let s='';if(kind==='box')s=`<rect x="65" y="100" width="190" height="130" rx="12" fill="#73a89a"/><path d="M160 100V230" stroke="#e7bd6c" stroke-width="25"/><g transform="translate(0 ${step>=2?-65:0})"><rect x="52" y="80" width="216" height="30" rx="8" fill="#adc6b3"/><path d="M160 80Q90 10 100 65Q140 85 160 80Q220 15 225 62Q185 85 160 80" fill="none" stroke="#e7bd6c" stroke-width="12" opacity="${step?0:1}"/></g>`;if(kind==='egg')s=`<path d="M160 28C90 28 60 180 90 220C120 260 215 260 238 210C265 155 208 28 160 28" fill="#c2cbec"/><path d="M80 150L120 135L142 172L175 141L199 170L242 144" stroke="#fffaf3" stroke-width="${step*3}" fill="none"/>`;if(kind==='cookie')s=`<g transform="translate(${step?-20:0} 0) rotate(${step?-12:0} 160 160)"><path d="M160 60Q35 55 68 204L160 145Z" fill="#c99b73"/></g><g transform="translate(${step?20:0} 0) rotate(${step?12:0} 160 160)"><path d="M160 60Q285 55 252 204L160 145Z" fill="#e7bd6c"/></g>`;if(kind==='heart')s=`<path d="M160 230C0 130 75 8 160 87C245 8 320 130 160 230" fill="#dfaca9" transform="translate(160 140) scale(${1+step*.025}) translate(-160 -140)"/>`;if(kind==='ticket')s=`<path d="M40 65H280V110Q240 140 280 170V215H40V170Q80 140 40 110Z" fill="#e7bd6c"/><path d="M225 65V215" stroke="#c99b73" stroke-width="3" stroke-dasharray="8 7"/><text x="145" y="152" text-anchor="middle" font-size="32" fill="#251f21">${step?'★':'?'}</text>`;return `<svg class="native-art" viewBox="0 -65 320 345" aria-hidden="true">${s}</svg>`}
function openNative(n){stopNative();$('ideaName').textContent=ideas.find(x=>x.number===n).name;$('ideaIcon').innerHTML='';$('ideaDetail').textContent='';$('ideaCaveat').textContent='Original local activity. No external links or uploads.';$('sourceName').textContent='Made here';$('nativeStage').hidden=false;
if([2,3,6].includes(n)){$('ideaDialog').close();$('drawer').close();mode={2:'cake',3:'scratch',6:'balloons'}[n];render();if(n===3&&!scratchReady)scratchReset();$('reset').focus();return}
if(!nativeDone.has(n)){nativeUI('<p class="caption">Native version is being built. Not counted as complete.</p>');return}
if([1,4,7,10,18].includes(n)){let step=0,max={1:2,4:4,7:1,10:5,18:2}[n],kind={1:'box',4:'egg',7:'cookie',10:'heart',18:'ticket'}[n];const draw=()=>{nativeUI(nativeArt(kind,step)+`<p id="nativeFeedback" class="reveal" role="status">${step>=max?nativeNotes[(n+step)%6]:{1:step?'Lift the lid':'Untie the ribbon',4:`${step} / 4 cracks`,7:'Crack for a tiny fortune',10:`${step} / 5 heartbeats`,18:step?'Turn the ticket':'Peel the corner'}[n]}</p>`+nbutton('nact',step>=max?'Again ↻':{1:step?'Open':'Untie',4:'Tap the egg',7:'Crack',10:'Heartbeat',18:'Peel'}[n]));$('nact').onclick=()=>{step=step>=max?0:step+1;draw();$('nact').focus()}};draw()}
if(n===5){let popped=new Set;const draw=()=>{nativeUI(`<div class="bubble-grid">${Array.from({length:16},(_,i)=>`<button data-bubble="${i}" aria-label="${popped.has(i)?'Popped':'Pop bubble'} ${i+1}" ${popped.has(i)?'disabled':''}>${popped.has(i)?'✓':'○'}</button>`).join('')}</div><p id="nativeFeedback" role="status">${popped.size===16?'A tiny pocket of joy.':popped.size+' / 16 popped'}</p>`+nbutton('nagain','Again ↻'));$('nativeStage').querySelectorAll('[data-bubble]').forEach(b=>b.onclick=()=>{popped.add(+b.dataset.bubble);draw()});$('nagain').onclick=()=>{popped.clear();draw()}};draw()}
if(n===11){let seen=new Set;nativeUI(`<div class="star-field">${Array.from({length:6},(_,i)=>`<button data-star="${i}" aria-label="Star ${i+1}" style="left:${12+(i*17)%76}%;top:${10+(i*29)%72}%">☆</button>`).join('')}</div><p id="nativeFeedback" class="reveal" role="status">Choose a star.</p>`);$('nativeStage').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{seen.add(+b.dataset.star);b.textContent='★';$('nativeFeedback').textContent=nativeNotes[+b.dataset.star]+` ${seen.size} / 6 stars`})}
if(n===14){nativeUI(`<div class="native-boxes">${[0,1,2].map(i=>`<button data-box="${i}" aria-label="Open box ${i+1}">${icon('gift')}<span>${i+1}</span></button>`).join('')}</div><p id="nativeFeedback" class="reveal" role="status">Choose a box.</p>`);$('nativeStage').querySelectorAll('[data-box]').forEach(b=>b.onclick=()=>{$('nativeFeedback').textContent=nativeNotes[+b.dataset.box];b.classList.add('chosen');b.setAttribute('aria-pressed','true')})}
if(n===17){let chosen=[],target=[0,2,1];const draw=()=>{nativeUI(`<p class="lock-code" aria-label="Target: star, moon, heart">★ ☾ ♥</p><p class="caption">Tap the same order.</p><div class="controls">${['★','♥','☾'].map((x,i)=>nbutton('lock'+i,x,`aria-label="${['Star','Heart','Moon'][i]}"`)).join('')}</div><p id="nativeFeedback" class="reveal" role="status">${chosen.length===3?(chosen.every((x,i)=>x===target[i])?'Unlocked. A wish, all yours.':'Not quite. Try again.'):chosen.map(i=>['★','♥','☾'][i]).join(' ')||'Your turn'}</p>`+nbutton('nagain','Reset'));[0,1,2].forEach(i=>$('lock'+i).onclick=()=>{if(chosen.length===3)chosen=[];chosen.push(i);draw()});$('nagain').onclick=()=>{chosen=[];draw()}};draw()}
if(n===9){let vals=['★','☾','♥'],running=false,round=0;const draw=()=>{nativeUI(`<div class="reel-row">${vals.map(x=>`<span>${x}</span>`).join('')}</div><p class="caption">Just symbols. No stakes or prizes.</p><p id="nativeFeedback" class="reveal" role="status">${round?'A little luck. A little joy.':'Spin a tiny surprise.'}</p>`+nbutton('nact',running?'Stop':'Spin'));$('nact').onclick=()=>{if(running){running=false;stopNative();round++;draw()}else{running=true;draw();const tick=()=>{if(!running)return;vals=vals.map(()=>['★','☾','♥'][Math.floor(Math.random()*3)]);$('nativeStage').querySelectorAll('.reel-row span').forEach((v,i)=>v.textContent=vals[i]);later(tick,150)};tick();later(()=>{running=false;stopNative();round++;draw()},1500)}}};draw()}
if(n===19){let angle=0,busy=false;nativeUI(`<div class="wheel-wrap"><span class="wheel-pointer">▼</span><div id="nwheel" class="native-wheel">${['★','☾','♥','✿','☕','♫'].map((x,i)=>`<span style="transform:rotate(${i*60}deg) translateY(-85px) rotate(-${i*60}deg)">${x}</span>`).join('')}</div></div><p id="nativeFeedback" class="reveal" role="status">A spin, just for fun.</p>`+nbutton('nact','Spin'));$('nact').onclick=()=>{if(busy)return;busy=true;$('nact').disabled=true;let choice=Math.floor(Math.random()*6);angle+=720+(360-angle%360)+choice*60;$('nwheel').style.transform=`rotate(${angle}deg)`;later(()=>{busy=false;$('nact').disabled=false;$('nativeFeedback').textContent=nativeNotes[(6-choice)%6]},matchMedia('(prefers-reduced-motion:reduce)').matches?0:950)}}
}
</script></body></html>
