function nativePhoto(){const session=nativeSession;let tiles=[4,0,8,2,6,1,7,5,3],selectedTile=-1,moves=0,preview=false,busy=false;const fallback='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" fill="#161f2b"/><circle cx="430" cy="145" r="80" fill="#e7bd6c"/><path d="M0 440L150 245L310 475L440 310L600 470V600H0Z" fill="#73a89a"/><path d="M0 520Q300 410 600 540V600H0Z" fill="#adc6b3"/><path d="M90 90l7 18 18 7-18 7-7 18-7-18-18-7 18-7ZM235 70l5 12 12 5-12 5-5 12-5-12-12-5 12-5ZM310 210l6 14 14 6-14 6-6 14-6-14-14-6 14-6Z" fill="#fffaf3"/></svg>`);let photo=fallback;

function nativeReels(){const symbols=['★','☾','♥','✿','☕','♫'],names=['Star','Moon','Heart','Flower','Coffee','Music'];let vals=[0,1,2],moving=[false,false,false],round=0;const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;const status=()=>{const any=moving.some(Boolean);$('nativeFeedback').textContent=any?'Tap a reel to stop it.':round?nativeNotes[(vals[0]+vals[1]+vals[2])%nativeNotes.length]:'Three little symbols. One tiny surprise.';$('reelSpin').disabled=any;$('reelSpin').textContent=round?'Spin again':'Spin';$('reelStopAll').disabled=!any;};const update=()=>{vals.forEach((v,i)=>{const b=$('reel'+i);b.textContent=symbols[v];b.setAttribute('aria-label',`Reel ${i+1}: ${names[v]}. ${moving[i]?'Stop':'Stopped'}`);b.disabled=!moving[i];b.classList.toggle('reel-moving',moving[i])});status()};const stop=i=>{if(!moving[i])return;moving[i]=false;update();if(!moving.some(Boolean)){stopNative();$('reelSpin').focus()}};nativeUI(`<div class="reel-row" aria-label="Symbol reels">${vals.map((v,i)=>nbutton('reel'+i,symbols[v])).join('')}</div><p id="nativeFeedback" class="reveal" role="status"></p><div class="controls">${nbutton('reelSpin','Spin')}${nbutton('reelStopAll','Stop all')}</div><p class="caption">Just a playful reveal. No money, bets or prizes.</p>`);vals.forEach((_,i)=>$('reel'+i).onclick=()=>stop(i));$('reelStopAll').onclick=()=>{[0,1,2].forEach(stop)};$('reelSpin').onclick=()=>{if(moving.some(Boolean))return;round++;moving=[true,true,true];const tick=()=>{if(!moving.some(Boolean))return;vals=vals.map((v,i)=>moving[i]?Math.floor(Math.random()*symbols.length):v);update();if(!reduced)later(tick,180)};tick();[0,1,2].forEach(i=>later(()=>stop(i),1600+i*400));$('reel0').focus()};update();}

function nativeVoices(){const greetings=[{title:'A little cheer',symbol:'✦',text:'A little cheer, just for you. May today bring a small, unexpected smile.'},{title:'A gentle wish',symbol:'☾',text:'A gentle birthday wish. Keep a little wonder, and make room for something you love.'},{title:'Your tiny pause',symbol:'♡',text:'This tiny pause is yours. Take a breath. You deserve a little warmth today.'}];let audio=null,serial=0,choice=-1;const quiet=()=>{serial++;if(audio){audio.onended=audio.onerror=null;audio.pause();audio.removeAttribute('src');audio.load();audio=null}nativeTimers.forEach(t=>clearTimeout(t));nativeTimers=[];if($('voiceStop')){$('voiceStop').disabled=true;document.querySelectorAll('[data-voice]').forEach(b=>b.setAttribute('aria-pressed','false'));$('nativeFeedback').textContent='Quiet again.'}};nativeCleanup=quiet;nativeUI(`<p class="caption">Three little wishes. Tap a card, then listen.</p><div class="voice-wall">${greetings.map((g,i)=>`<button data-voice="${i}" aria-pressed="false"><span aria-hidden="true">${g.symbol}</span>${g.title}</button>`).join('')}</div><p id="voiceWords" class="voice-words">Choose a little wish.</p><p id="nativeFeedback" class="reveal" role="status">Quiet until you press play.</p><div class="controls">${nbutton('voicePlay','Play wish','disabled')}${nbutton('voiceStop','Stop','disabled')}</div><p class="caption">Generated voice, not personal recordings. Original wishes, bundled here. Start with a low phone volume.</p>`);document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>{quiet();nativeCleanup=quiet;choice=+b.dataset.voice;b.setAttribute('aria-pressed','true');$('voiceWords').textContent=greetings[choice].text;$('voicePlay').disabled=false;$('nativeFeedback').textContent='Your wish is ready.'});$('voicePlay').onclick=async()=>{if(choice<0)return;quiet();nativeCleanup=quiet;const token=serial;try{audio=new Audio(voiceClips[choice]);audio.preload='none';audio.volume=.7;const current=audio;current.onended=()=>{if(token===serial&&audio===current){quiet();$('nativeFeedback').textContent='A little wish, all yours.'}};current.onerror=()=>{if(token===serial&&audio===current){quiet();$('nativeFeedback').textContent='Audio could not play. Your wish is above.'}};$('voiceStop').disabled=false;$('nativeFeedback').textContent='Starting your little wish...';later(()=>{if(token===serial){quiet();$('nativeFeedback').textContent='Audio stopped. Your wish is above.'}},15000);await current.play();if(token!==serial)return;$('nativeFeedback').textContent='Playing your little wish.';document.querySelector(`[data-voice="${choice}"]`).setAttribute('aria-pressed','true')}catch{if(token!==serial)return;quiet();$('nativeFeedback').textContent='Audio could not play. Your wish is above.'}};$('voiceStop').onclick=quiet;}

ton('mysteryReset','Wrap again')}`);document.querySelectorAll('[data-mystery]').forEach(b=>b.onclick=()=>{last=+b.dataset.mystery;seen.add(last);draw();document.querySelector(`[data-mystery="${last}"]`).focus()});$('mysteryReset').onclick=()=>{seen.clear();last=-1;draw();document.querySelector('[data-mystery]').focus()}};draw();}

function nativeCalendar(){const key='wish-calendar-v1',day=()=>{const d=new Date;return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)},today=day();let state=calendarMemory?{start:calendarMemory.start,opened:[...calendarMemory.opened]}:{start:today,opened:[]},saved=true,chosen=-1,resetAsk=false;try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Number.isInteger(v.start)&&v.start>=today-3650&&v.start<=today&&Array.isArray(v.opened))state={start:v.start,opened:[...new Set(v.opened.filter(n=>Number.isInteger(n)&&n>=0&&n<7))]}}catch{saved=false}const notes=['A little sunshine for your pocket.','Make room for a tiny happy pause.','Keep a little wonder close.','A small spark is still a spark.','Let one good thing linger.','A quiet wish, just for you.','Seven little days. One warm smile.'],symbols=['☀','♡','✦','★','✿','☾','♫'];const store=()=>{calendarMemory={start:state.start,opened:[...state.opened]};try{localStorage.setItem(key,JSON.stringify(state));saved=true}catch{saved=false}};store();const stamp=i=>new Date((state.start+i)*86400000).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'});const draw=()=>{const now=day(),elapsed=Math.max(0,now-state.start);nativeUI(`<p class="caption">A seven-day pocket calendar. Today's treat is ready.</p><div class="surprise-calendar" aria-label="Seven dated treats">${notes.map((n,i)=>{const opened=state.opened.includes(i),locked=i>elapsed;return `<button data-day="${i}" aria-label="${stamp(i)}, ${locked?'not ready yet':opened?'opened':'open treat'}" aria-pressed="${chosen===i}" ${locked?'disabled':''}><small>${stamp(i)}</small><span aria-hidden="true">${opened?symbols[i]:locked?'○':'?'}</span><small>${locked?'Later':opened?'Opened':'Ready'}</small></button>`}).join('')}</div><p id="nativeFeedback" class="reveal" role="status">${chosen<0?'Tap a ready date.':notes[chosen]}</p><p id="calendarCount" class="caption" role="status">${state.opened.length} / 7 opened</p><p id="calendarStorage" class="caption">${saved?'Progress saved in this browser. Clearing browser data removes it.':'Storage is unavailable. Progress lasts only while this page is open.'}</p><p class="caption">Dates use this device's calendar. Later treats open when you return on that day. No messages or reminders are sent.</p><div class="controls">${nbutton('calendarReset',resetAsk?'Start again today':'Restart calendar')}${resetAsk?nbutton('calendarKeep','Keep my progress'):''}</div>${resetAsk?'<p class="caption">Starting again clears only this calendar, not favourites.</p>':''}`);document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const i=+b.dataset.day;if(i>Math.max(0,day()-state.start)){draw();return}chosen=i;if(!state.opened.includes(i))state.opened.push(i);store();draw();document.querySelector(`[data-day="${i}"]`).focus()});$('calendarReset').onclick=()=>{if(!resetAsk){resetAsk=true;draw();$('calendarReset').focus();return}state={start:day(),opened:[]};chosen=-1;resetAsk=false;store();draw();document.querySelector('[data-day]').focus()};if($('calendarKeep'))$('calendarKeep').onclick=()=>{resetAsk=false;draw();$('calendarReset').focus()}};draw();}

function nativeCapsule(){const key='wish-capsule-v1',choices=[{label:'10-second preview',ms:10000},{label:'In one minute',ms:60000},{label:'Tomorrow',days:1},{label:'In seven days',days:7}];let saved=true,state=capsuleMemory,ask=false;try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Number.isFinite(v.unlock)&&v.unlock>0&&v.unlock<Date.now()+8*86400000&&typeof v.opened==='boolean')state=v}catch{saved=false}const persist=()=>{capsuleMemory=state;try{if(state)localStorage.setItem(key,JSON.stringify(state));else localStorage.removeItem(key);saved=true}catch{saved=false}};const clearTick=()=>{nativeTimers.forEach(t=>clearTimeout(t));nativeTimers=[]};const visible=()=>{if(!document.hidden&&$('ideaDialog').open&&selected.number===16){nativeCleanup=cleanup;update();schedule()}};const cleanup=()=>{clearTick();document.removeEventListener('visibilitychange',visible)};const schedule=()=>{clearTick();if(state&&!state.opened&&state.unlock>Date.now()&&!document.hidden)later(()=>{update();schedule()},1000)};const update=()=>{if(!$('capsuleOpen')||!state)return;const ready=Date.now()>=state.unlock;$('capsuleOpen').disabled=!ready;$('nativeFeedback').textContent=state.opened?'A little collection, saved for this moment.':ready?'Your capsule is ready. Tap to open.':'Sealed · '+Math.max(1,Math.ceil((state.unlock-Date.now())/1000))+' seconds left.';if(ready)clearTick()};const draw=()=>{clearTick();nativeUI(`<div class="capsule-art ${state?.opened?'capsule-open':''}" aria-hidden="true"><div class="capsule-cap"></div><div class="capsule-body">${state?.opened?'✦ ♡ ☾':'✦'}</div></div>${!state?`<p class="caption">Choose when to open three original tiny wishes.</p><div class="capsule-choices">${choices.map((c,i)=>nbutton('seal'+i,c.label)).join('')}</div>`:state.opened?'<div class="capsule-keepsakes"><p>✦ Keep a little wonder.</p><p>♡ Make room for joy.</p><p>☾ A soft pause, all yours.</p></div>':`<p class="caption">Opens ${new Date(state.unlock).toLocaleString()} on this device.</p>${nbutton('capsuleOpen','Open capsule','disabled')}`}<p id="nativeFeedback" class="reveal" role="status">${state?.opened?'A little collection, saved for this moment.':'Choose a small wait.'}</p><p class="caption">${saved?'Saved only in this browser. Clearing browser data removes it.':'Storage is unavailable. Keep this page open to keep the capsule.'}</p><p class="caption">A playful time lock, not private or secure storage. It uses the device clock. No notification will be sent; return here to open it.</p>${state?`<div class="controls">${nbutton('capsuleReset',ask?'Clear capsule':'Start a new capsule')}${ask?nbutton('capsuleKeep','Keep this capsule'):''}</div>`:''}`);if(!state)choices.forEach((c,i)=>$('seal'+i).onclick=()=>{let unlock;if(c.days){const d=new Date;d.setDate(d.getDate()+c.days);unlock=d.getTime()}else unlock=Date.now()+c.ms;state={unlock,opened:false};persist();draw();$('capsuleOpen').focus()});if($('capsuleOpen'))$('capsuleOpen').onclick=()=>{if(Date.now()<state.unlock){update();return}state.opened=true;persist();draw()};if($('capsuleReset'))$('capsuleReset').onclick=()=>{if(!ask){ask=true;draw();$('capsuleReset').focus();return}state=null;ask=false;persist();draw();$('seal0').focus()};if($('capsuleKeep'))$('capsuleKeep').onclick=()=>{ask=false;draw();$('capsuleReset').focus()};update();schedule()};document.addEventListener('visibilitychange',visible);nativeCleanup=cleanup;draw();}

function nativeWheel(){const marks=['★','☾','♥','✿','☕','♫'],names=['Spark','Moon','Heart','Bloom','Pause','Rhythm'],notes=['Keep your little spark.','A quiet moonlit moment.','A little warmth, all yours.','Let a tiny happy thought bloom.','Take a small, easy pause.','A tiny rhythm for your day.'],colors=['#73a89a','#c2cbec','#dfaca9','#e7bd6c','#88bac1','#c99b73'];let angle=0,busy=false,choice=-1,spins=0,timer=null;const point=(a,r)=>[120+Math.cos(a*Math.PI/180)*r,120+Math.sin(a*Math.PI/180)*r];let wedges='';for(let i=0;i<6;i++){const a=-90+i*60,p=point(a-30,114),q=point(a+30,114),m=point(a,78);wedges+=`<path d="M120 120L${p}A114 114 0 0 1 ${q}Z" fill="${colors[i]}" stroke="#fffaf3" stroke-width="2"/><text x="${m[0]}" y="${m[1]+8}" text-anchor="middle" font-size="28" fill="#251f21">${marks[i]}</text>`}nativeUI(`<p class="caption">Spin for a tiny mood. Nothing to buy or redeem.</p><div class="mood-wheel-wrap"><span class="mood-wheel-pointer" aria-hidden="true">▼</span><svg id="moodWheel" viewBox="0 0 240 240" role="img" aria-label="Six-mood wheel">${wedges}<circle cx="120" cy="120" r="17" fill="#fffaf3"/><circle cx="120" cy="120" r="7" fill="#334e48"/></svg></div><p id="wheelChoice" class="wheel-choice">Ready for a little spin?</p><p id="nativeFeedback" class="reveal" role="status">A surprise, just for fun.</p><div class="controls">${nbutton('wheelSpin','Spin')}${nbutton('wheelReset','Reset')}</div><p id="wheelCount" class="caption">0 spins</p><div class="wheel-legend">${names.map((n,i)=>`<span>${marks[i]} ${n}</span>`).join('')}</div>`);

function nativeReflex(){let duel=false,phase='ready',player=0,scores=[0,0],target=4,remaining=30000,started=0,timer=null;nativeUI(`<p class="caption">Tap the star for 30 seconds. Solo, or take turns on one device.</p><div class="controls">${nbutton('reflexSolo','Solo','aria-pressed="true"')}${nbutton('reflexDuel','Two players','aria-pressed="false"')}</div><div class="reflex-stats"><span id="reflexPlayer">Solo</span><strong id="reflexClock">30s</strong><span id="reflexScore">0 taps</span></div><div class="reflex-grid">${Array.from({length:9},(_,i)=>nbutton('reflexCell'+i,'○',`aria-label="Empty spot ${i+1}" disabled`)).join('')}</div><p id="nativeFeedback" class="reveal" role="status">Ready for a tiny challenge?</p><div class="controls">${nbutton('reflexStart','Start')}${nbutton('reflexPause','Pause','disabled')}${nbutton('reflexReset','Reset')}</div><p class="caption">Just for fun, not a reaction-time test. No score uploads.</p>`);

$('doodleUndo').onclick=()=>{end();redo.push(items.pop());render()};$('doodleRedo').onclick=()=>{items.push(redo.pop());render()};$('doodleClear').onclick=()=>{end();items=[];redo=[];render();$('nativeFeedback').textContent='A fresh little canvas.'};$('doodleDone').onclick=()=>{end();finished=!finished;render();$('nativeFeedback').textContent=finished?'Your tiny masterpiece. Made by you.':'Keep making your little marks.'};$('doodleNext').onclick=()=>{prompt=(prompt+1)%prompts.length;render();$('nativeFeedback').textContent='A new idea. Your drawing stays.'};nativeCleanup=end;render();}

function nativeGallery(){const levels=[{start:20,goal:4,walls:[6,7,8,11,13,16,18]},{start:0,goal:24,walls:[2,6,7,9,11,14,16,17,19]},{start:22,goal:2,walls:[1,5,6,8,11,13,16,18,23]}];let level=0,pos=levels[0].start,moves=0,won=false;const pieces=[`<circle cx="50" cy="40" r="20" fill="#e7bd6c"/><path d="M5 80Q50 45 95 80" fill="none" stroke="#73a89a" stroke-width="8"/>`,`<path d="M50 78C-5 40 22 5 50 32C78 5 105 40 50 78" fill="#dfaca9"/>`,`<path d="M50 7L60 35L90 38L67 57L74 87L50 70L26 87L33 57L10 38L40 35Z" fill="#e7bd6c"/>`];const art=()=>`<svg class="gallery-piece" viewBox="0 0 100 100" role="img" aria-label="Delivered original artwork"><rect width="100" height="100" rx="8" fill="#334e48"/>${pieces[level]}</svg>`;nativeUI(`<p class="caption">Carry the little frame to the easel. Move around the plants.</p><div id="galleryGrid" class="gallery-grid" role="img"></div><p id="galleryStats" class="caption"></p><div id="galleryArt"></div><p id="nativeFeedback" class="reveal" role="status">A tiny gallery delivery.</p><div class="gallery-pad">${nbutton('galleryUp','↑','aria-label="Move up"')}${nbutton('galleryLeft','←','aria-label="Move left"')}${nbutton('galleryDown','↓','aria-label="Move down"')}${nbutton('galleryRight','→','aria-label="Move right"')}</div><div class="controls">${nbutton('galleryReset','Restart room')}${nbutton('galleryNext','Next room','hidden')}${nbutton('galleryAgain','Play again','hidden')}</div><p class="caption">Frame ▣ · Easel ◇ · Plant ✿. Arrow keys work too.</p>`);
const update=()=>{const l=levels[level];$('galleryGrid').innerHTML=Array.from({length:25},(_,i)=>`<span class="${i===pos?'carrier':i===l.goal?'easel':l.walls.includes(i)?'plant':''}">${i===pos?'▣':i===l.goal?'◇':l.walls.includes(i)?'✿':'·'}</span>`).join('');$('galleryGrid').setAttribute('aria-label','Room '+(level+1)+'. Frame row '+(Math.floor(pos/5)+1)+', column '+(pos%5+1)+'. Easel row '+(Math.floor(l.goal/5)+1)+', column '+(l.goal%5+1));$('galleryStats').textContent='Room '+(level+1)+' / 3 · '+moves+' moves';$('galleryArt').innerHTML=won?art():'';['Up','Left','Down','Right'].forEach(x=>$('gallery'+x).disabled=won);$('galleryNext').hidden=!won||level===2;$('galleryAgain').hidden=!won||level!==2;};const move=(dx,dy)=>{if(won)return;const x=pos%5+dx,y=Math.floor(pos/5)+dy,q=y*5+x;if(x<0||x>4||y<0||y>4||levels[level].walls.includes(q)){$('nativeFeedback').textContent='A plant or wall. Try another way.';return}pos=q;moves++;won=pos===levels[level].goal;$('nativeFeedback').textContent=won?(level===2?'Three artworks delivered. Tiny gallery complete.':'Delivered safely. A little artwork!'):'One careful step.';update()};[['Up',0,-1],['Left',-1,0],['Down',0,1],['Right',1,0]].forEach(([n,x,y])=>$('gallery'+n).onclick=()=>move(x,y));const reset=()=>{pos=levels[level].start;moves=0;won=false;$('nativeFeedback').textContent='A fresh little route.';update()};$('galleryReset').onclick=reset;$('galleryNext').onclick=()=>{if(won&&level<2){level++;reset();$('galleryUp').focus()}};$('galleryAgain').onclick=()=>{level=0;reset();$('galleryUp').focus()};const keys=e=>{if(!$('ideaDialog').open||selected?.number!==47)return;const dir={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(dir){e.preventDefault();move(...dir)}};document.addEventListener('keydown',keys);nativeCleanup=()=>document.removeEventListener('keydown',keys);update();}

function nativeBalance(){let room=0,x=.5,v=.035,tilt=0,tiltUntil=0,elapsed=0,last=0,raf=0,phase='ready';const duration=12,colors=['#73a89a','#c99b73','#c2cbec'];nativeUI(`<p class="caption">Tilt the shelf to keep the moon inside. Balance for 12 seconds in each of three rooms.</p><div class="balance-scene" role="img" aria-label="Moon on a balancing shelf"><div id="balanceShelf" class="balance-shelf"><span id="balanceMoon" class="balance-moon">☾</span><i></i></div><span class="balance-edge left">↓</span><span class="balance-edge right">↓</span></div><p id="balanceStats" class="caption"></p><progress id="balanceProgress" max="12" value="0" aria-label="Balanced seconds"></progress><p id="nativeFeedback" class="reveal" role="status">A little moon, a wobbly shelf.</p><div class="balance-pad">${nbutton('balanceLeft','← Tilt left')}${nbutton('balanceRight','Tilt right →')}</div><div class="controls">${nbutton('balanceStart','Start')}${nbutton('balancePause','Pause','disabled')}${nbutton('balanceReset','Restart')}</div><div id="balanceArt"></div><p class="caption">Tap to tilt briefly. Left/right arrow keys work too. No motion sensor needed.</p>`);
const render=()=>{$('balanceMoon').style.left=x*100+'%';$('balanceShelf').style.transform=`rotate(${tilt*11}deg)`;$('balanceMoon').dataset.x=x;$('balanceStats').textContent=`Room ${room+1} / 3 · ${elapsed.toFixed(1)} / 12 seconds`;$('balanceProgress').value=elapsed;$('balancePause').disabled=!['playing','paused'].includes(phase);$('balancePause').textContent=phase==='paused'?'Resume':'Pause';$('balanceLeft').disabled=$('balanceRight').disabled=phase!=='playing';$('balanceStart').disabled=phase==='playing'||phase==='paused';$('balanceStart').textContent=phase==='won'?(room===2?'Play again':'Next room'):phase==='lost'?'Try again':'Start'};
const artwork=()=>`<svg class="balance-art" viewBox="0 0 160 100" role="img" aria-label="Original moon-room artwork"><rect width="160" height="100" rx="12" fill="${colors[room]}"/><circle cx="108" cy="30" r="18" fill="#fffaf3"/><path d="M0 85Q40 ${room*10+35} 80 80T160 80V100H0Z" fill="#334e48"/><path d="M22 22l4 8 8 4-8 4-4 8-4-8-8-4 8-4Z" fill="#e7bd6c"/></svg>`;
const stop=()=>{cancelAnimationFrame(raf);raf=0};const pause=()=>{if(phase!=='playing')return;stop();phase='paused';$('nativeFeedback').textContent='Paused. Your moon can wait.';render()};
const step=now=>{if(phase!=='playing')return;const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;elapsed+=dt;if(now>tiltUntil)tilt=0;const wind=Math.sin(elapsed*1.7+room)*(.04+room*.014);v+=(tilt*.5+wind)*dt;v*=Math.exp(-.48*dt);x+=v*dt;if(x<.055||x>.945){phase='lost';stop();$('nativeFeedback').textContent='The moon slipped. Try a gentler tilt.'}else if(elapsed>=duration){elapsed=duration;phase='won';stop();$('balanceArt').innerHTML=artwork();$('nativeFeedback').textContent=room===2?'Three moons balanced. A little calm, earned.':'Room balanced. A tiny artwork is yours.'}render();if(phase==='playing')raf=requestAnimationFrame(step)};
const fresh=()=>{stop();x=.5;v=.035+(room*.012);tilt=0;elapsed=0;phase='ready';$('balanceArt').innerHTML='';$('nativeFeedback').textContent='Keep the moon away from the edges.';render()};
$('balanceStart').onclick=()=>{if(phase==='won'){room=room===2?0:room+1;fresh()}else if(phase==='lost')fresh();phase='playing';last=performance.now();$('nativeFeedback').textContent='Small tilts. Find your balance.';render();raf=requestAnimationFrame(step)};
const nudge=direction=>{if(phase!=='playing')return;tilt=direction*.6;tiltUntil=performance.now()+450;render()};$('balanceLeft').onclick=()=>nudge(-1);$('balanceRight').onclick=()=>nudge(1);$('balancePause').onclick=()=>{if(phase==='playing')pause();else if(phase==='paused'){phase='playing';last=performance.now();$('nativeFeedback').textContent='Small tilts. Find your balance.';render();raf=requestAnimationFrame(step)}};$('balanceReset').onclick=()=>{room=0;fresh()};const keys=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)&&$('ideaDialog').open){e.preventDefault();if(!e.repeat)nudge(e.key==='ArrowLeft'?-1:1)}};const hidden=()=>{if(document.hidden)pause()};document.addEventListener('keydown',keys);document.addEventListener('visibilitychange',hidden);nativeCleanup=()=>{stop();document.removeEventListener('keydown',keys);document.removeEventListener('visibilitychange',hidden)};render();}

function nativeOdd(){let round=0,score=0,tries=0,found=false,odd=0,missed=new Set;const labels=['sun','flower','mountains','mug','window','moon'];const choose=()=>{odd=crypto.getRandomValues(new Uint32Array(1))[0]%9;tries=0;found=false;missed.clear()};const picture=different=>{let drawing='';if(round===0)drawing=`<circle cx="50" cy="50" r="${different?13:21}" fill="#e7bd6c"/>`+Array.from({length:8},(_,i)=>`<path d="M50 12V20" stroke="#e7bd6c" stroke-width="4" transform="rotate(${i*45} 50 50)"/>`).join('');if(round===1)drawing=Array.from({length:different?4:5},(_,i)=>`<ellipse cx="50" cy="30" rx="9" ry="17" fill="#dfaca9" transform="rotate(${i*(different?90:72)} 50 50)"/>`).join('')+'<circle cx="50" cy="50" r="10" fill="#e7bd6c"/>';if(round===2)drawing=`<path d="M8 80L35 25L65 80Z" fill="#73a89a"/><path d="M40 80L70 ${different?50:30}L95 80Z" fill="#adc6b3"/>`;if(round===3)drawing=`<path d="M26 30H66V73Q46 88 26 73Z" fill="#c99b73"/><path d="M66 40H78Q90 55 78 68H66" fill="none" stroke="#c99b73" stroke-width="6"/>${different?'':'<path d="M39 23Q32 16 40 9M53 23Q46 16 54 9" fill="none" stroke="#fffaf3" stroke-width="3"/>'}`;if(round===4)drawing=`<rect x="20" y="18" width="60" height="64" rx="5" fill="#c2cbec"/><path d="M50 18V82${different?'':'M20 50H80'}" stroke="#334e48" stroke-width="5"/>`;if(round===5)drawing=`<circle cx="50" cy="50" r="28" fill="#fffaf3"/><circle cx="${different?38:63}" cy="40" r="24" fill="#334e48"/>`;return `<svg viewBox="0 0 100 100" role="img" aria-label="${labels[round]} artwork ${different?'with a changed detail':'with the matching detail'}"><rect width="100" height="100" rx="10" fill="#334e48"/>${drawing}</svg>`};
const draw=()=>{nativeUI(`<p class="caption">Find the one artwork with a different detail. Six rounds, no timer.</p><div class="odd-grid">${Array.from({length:9},(_,i)=>`<button data-odd="${i}" aria-label="Artwork ${i+1}" ${found||missed.has(i)?'disabled':''} class="${found&&i===odd?'odd-found':''}">${picture(i===odd)}${missed.has(i)?'<span class="odd-mark">×</span>':''}${found&&i===odd?'<span class="odd-mark">✓</span>':''}</button>`).join('')}</div><p id="oddStats" class="caption">Round ${round+1} / 6 · ${score} first-try finds</p><p id="nativeFeedback" class="reveal" role="status">${found?(round===5?'Six little details spotted. A sharper eye, a tiny smile.':'Spotted. On to the next little detail.'):(tries?'That one matches. Look for a changed shape or missing detail.':'One is a little different.')}</p><div class="controls">${nbutton('oddNext','Next round',found&&round<5?'':'hidden')}${nbutton('oddAgain',found&&round===5?'Play again':'Restart')}</div>`);$('nativeStage').querySelectorAll('[data-odd]').forEach(b=>b.onclick=()=>{if(found)return;const i=+b.dataset.odd;tries++;if(i===odd){found=true;if(tries===1)score++}else missed.add(i);draw();if(found)$(round===5?'oddAgain':'oddNext').focus();else $('nativeStage').querySelector('[data-odd]:not(:disabled)')?.focus()});$('oddNext').onclick=()=>{if(!found||round===5)return;round++;choose();draw()};$('oddAgain').onclick=()=>{round=0;score=0;choose();draw()}};choose();draw();}
</script></body></html>
