function picker(){const a=ideas.filter(x=>!only||stars.has(x.number));page=Math.min(page,Math.max(0,Math.ceil(a.length/12)-1));$('tiles').innerHTML=a.slice(page*12,page*12+12).map(x=>`<button class="idea-tile ${stars.has(x.number)?'starred':''}" data-idea="${x.number}">${icon(chooseIcon(x.name))}<span>${x.name}</span><span class="num">${x.number} · external ↗</span></button>`).join('')||'<p>No favourites yet.</p>';$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(a.length/12))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*12>=a.length;$('fav').textContent=only?'All ideas':'Favourites';$('tiles').querySelectorAll('button').forEach(b=>b.onclick=()=>openIdea(+b.dataset.idea))}
let selected;function openIdea(n){selected=ideas.find(x=>x.number===n);$('ideaName').textContent=selected.name;$('ideaIcon').innerHTML=icon(chooseIcon(selected.name),'hero-icon');$('ideaDetail').textContent=selected.detail;$('ideaCaveat').textContent='External source, not a completed local gift. Accounts, cost and phone support vary. Nothing is bought or uploaded.';$('source').href=selected.url;$('star').textContent=stars.has(n)?'Remove favourite':'Favourite';$('sourceName').textContent=new URL(selected.url).hostname;$('ideaDialog').showModal()}
$('browse').onclick=()=>{$('drawer').classList.add('open');picker();$('closeDrawer').focus()};$('closeDrawer').onclick=()=>{$('drawer').classList.remove('open');$('browse').focus()};$('closeDialog').onclick=()=>$('ideaDialog').close();$('star').onclick=()=>{stars.has(selected.number)?stars.delete(selected.number):stars.add(selected.number);$('star').textContent=stars.has(selected.number)?'Remove favourite':'Favourite';picker()};$('fav').onclick=()=>{only=!only;page=0;picker()};$('prev').onclick=()=>{page--;picker();$('tiles').scrollIntoView()};$('next').onclick=()=>{page++;picker();$('tiles').scrollIntoView()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ideaDialog').open){$('drawer').classList.remove('open');$('browse').focus()}});

let mode='cake',lit=[1,1,1,1],popped=Array(6).fill(false),colour='#c99b73',scratched=0;
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.mode===mode);$(b.dataset.mode).hidden=b.dataset.mode!==mode});$('flavours').hidden=mode!=='cake';$('cakeArt').innerHTML=`<svg class="hero-icon" viewBox="0 0 360 220" role="img" aria-label="Cake with ${lit.reduce((a,b)=>a+b,0)} candles lit"><ellipse cx="180" cy="192" rx="146" ry="13" fill="#e5ded2"/><path d="M55 109Q180 84 305 109V180Q180 206 55 180Z" fill="${colour}"/><ellipse cx="180" cy="109" rx="125" ry="22" fill="#f3e6d2"/><path d="M55 110Q80 147 102 120Q121 151 141 122Q165 151 185 122Q209 150 231 121Q261 148 305 110" fill="#f3e6d2"/>${lit.map((v,i)=>`<rect x="${105+i*45}" y="65" width="9" height="44" rx="3" fill="#73a89a"/>${v?`<path class="pop" d="M${109+i*45} 35Q${94+i*45} 57 ${109+i*45} 63Q${124+i*45} 57 ${109+i*45} 35" fill="#e7bd6c"/>`:''}`).join('')}<path d="M144 151L157 163L187 132" fill="none" stroke="#251f21" stroke-width="4" ${lit.some(Boolean)?'opacity="0"':''}/></svg>`;$('candles').innerHTML=lit.map((v,i)=>`<button data-candle="${i}" ${v?'':'disabled'} aria-label="${v?'Blow candle':'Candle out'} ${i+1}">${v?'Blow':'✓'} ${i+1}</button>`).join('');$('candles').querySelectorAll('button').forEach(b=>b.onclick=()=>{lit[+b.dataset.candle]=0;render()});$('pops').innerHTML=popped.map((v,i)=>`<button data-pop="${i}" aria-label="${v?'Popped':'Pop balloon'} ${i+1}" ${v?'disabled':''}>${v?icon('star'): `<svg viewBox="0 0 70 100" aria-hidden="true"><ellipse cx="35" cy="32" rx="23" ry="29" fill="${i%2?'#c99b73':'#73a89a'}"/><path d="M35 61Q20 77 35 94" fill="none" stroke="#746d64" stroke-width="2"/><ellipse cx="26" cy="23" rx="4" ry="9" fill="white" opacity=".5"/></svg>`}</button>`).join('');$('pops').querySelectorAll('button').forEach(b=>b.onclick=()=>{popped[+b.dataset.pop]=true;render()});$('feedback').textContent=mode==='cake'?(lit.some(Boolean)?`${lit.reduce((a,b)=>a+b,0)} candles · tap to blow`:'Make a wish.'):mode==='balloons'?`${popped.filter(Boolean).length} / 6 popped`:'Swipe to uncover. Or tap Reveal.'}
function scratchReset(){const c=$('scratchCanvas'),r=c.parentElement.getBoundingClientRect();c.width=Math.round(r.width*2);c.height=500;const x=c.getContext('2d');x.fillStyle='#73a89a';x.fillRect(0,0,c.width,c.height);x.fillStyle='#161f2b';x.font='40px Georgia';x.textAlign='center';x.fillText('Swipe here',c.width/2,260);scratched=0;c.hidden=false}let down=false;const c=$('scratchCanvas');c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);erase(e)};c.onpointermove=e=>{if(down)erase(e)};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;function erase(e){let r=c.getBoundingClientRect(),x=c.getContext('2d');x.globalCompositeOperation='destination-out';x.beginPath();x.arc((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height,45,0,Math.PI*2);x.fill();if(++scratched>45)c.hidden=true}
$('revealAll').onclick=()=>{c.hidden=true;$('feedback').textContent='A moment, just for you.'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();if(mode==='scratch')scratchReset()});document.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{colour=b.dataset.colour;document.querySelectorAll('[data-colour]').forEach(v=>v.setAttribute('aria-pressed',v===b));render()});$('reset').onclick=()=>{lit=[1,1,1,1];popped=Array(6).fill(false);render();if(mode==='scratch')scratchReset()};render();
</script></body></html>
